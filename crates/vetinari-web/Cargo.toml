[package]
name = "vetinari-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The web page that draws vetinarid's dev workflow runs"

[lints]
workspace = true

[dependencies]
vetinari-web-model.workspace = true
serde.workspace = true
serde_json.workspace = true
yew = { version = "0.23.0", features = ["csr"] }
gloo-net = { version = "0.7.0", default-features = false, features = ["http", "json", "eventsource"] }
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4"
futures = { workspace = true }
web-sys = { version = "0.3.106", features = ["Window", "Location", "History", "HtmlInputElement", "HtmlTextAreaElement"] }
