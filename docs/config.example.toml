# Vetinari configuration.
#
# Copy to ~/.config/vetinari/config.toml and edit. Every section is optional:
# with no configuration at all Vetinari starts with the Doom keymap, a work
# and a home profile, a Herdr and a tmux target, and no attention sources.
#
# YAML is also accepted (~/.config/vetinari/config.yaml) with the same shape.

[general]
# Which profile to start in. Must match one of the [[profiles]] ids below.
profile = "work"
# How often the interface redraws, in milliseconds.
tick_rate_ms = 250
# How often sources are polled, in seconds.
refresh_secs = 60
# How many log lines to keep for feedback capture (<Space> f f sends these
# to the implementing agent).
log_lines = 200
# How many recent queue actions (taken, parked, came back...) to show under
# the queue. 0 hides them.
recent_actions = 5


# --- Attention queue ---------------------------------------------------------
# When items you have set aside come back. Every return is recorded with the
# rule that caused it and what you did next, so these can be tuned from use.
[queue]
# Taking something else while working on an item parks it this long. 0 puts
# it straight back in the inbox.
switched_away_park_minutes = 10
# Close items that go away at their source, unless you are working on them.
close_when_gone = true
# Reopen finished items that need you again.
reopen_finished = true
# Let an urgent change (failed CI, a blocked agent) cut a timed park short.
urgent_breaks_snooze = true
# How long to wait on a reply before following up.
follow_up_after_minutes = 120
# What focus time holds back: code-review, issue-tracking, messaging,
# calendar, agent-state.
focus_mutes = ["messaging"]
# Show an agent inside the item it is working on, rather than as its own row.
fold_agents = true


# --- Context profiles -------------------------------------------------------
# Declaring any profile replaces the built-in work/home pair. <Space> p p
# cycles between them; <Space> p l chooses one.

[[profiles]]
id = "work"
name = "Work"
# Where spaces are opened: "herdr", "tmux", or "editor".
target = "herdr"
# Which sources to poll. Omit to poll them all.
sources = ["github", "jira", "slack", "calendar"]
# Where repositories live; the first is used to resolve a pull request's
# repository by name.
repo_roots = ["~/work"]
# Where worktrees are created. Without this, a .vetinari-worktrees directory
# beside the repository is used.
worktree_root = "~/work/.worktrees"
# Scopes credentials, so work and home can hold separate tokens for one
# provider. `vetinari auth <provider>` writes to the active profile's account,
# and `vetinari auth --account home <provider>` to another one.
account = "work"

# Which engine handles which class of work. Unlisted classes go to `default`.
# Classes: deep-code-change, pr-review, pr-summary, issue-summary,
# standup-summary, meeting-prep, enhancement, long-context-query.
[profiles.routing]
default = "claude-code"
pr-summary = "agy-gemini"
long-context-query = "agy-gemini"
standup-summary = "summariser"

[[profiles]]
id = "home"
name = "Home"
target = "tmux"
sources = ["github"]
repo_roots = ["~/src"]
account = "home"


# --- Agent engines ----------------------------------------------------------
# Declaring any engine replaces the built-in set. `kind` decides how the
# prompt reaches the tool: claude-code uses --print, agy takes the prompt as
# its last argument, and script receives it on stdin and in $VETINARI_PROMPT.

[agents.claude-code]
kind = "claude-code"
command = "claude"
args = ["--permission-mode", "acceptEdits"]

[agents.agy-gemini]
kind = "agy"
command = "agy"

[agents.summariser]
kind = "script"
command = "sh"
args = ["-c", "printf '%s\\n' \"$VETINARI_PROMPT\""]
env = { TZ = "UTC" }


# --- Workspace targets ------------------------------------------------------

[targets.herdr]
# Herdr's Unix socket. Without this, Vetinari resolves it the way Herdr does:
# $HERDR_SOCKET_PATH, then ~/.config/herdr/sessions/$HERDR_SESSION/herdr.sock
# for a named session, then ~/.config/herdr/herdr.sock. Set this only to
# address a socket none of those find.
# socket = "/run/user/1000/herdr.sock"

[targets.tmux]
# Vetinari keeps its own session so its windows never mix with yours.
session = "vetinari"

[targets.editor]
command = "zed"
args = []


# --- Attention sources ------------------------------------------------------
# Each needs a credential: run `vetinari auth <provider>` or press
# <Space> h a in the interface.

[sources.github]
kind = "github"
query = "is:open is:pr review-requested:@me archived:false"
# base_url = "https://github.acme.test/api/v3"   # GitHub Enterprise

[sources.jira]
kind = "jira"
base_url = "https://acme.atlassian.net"
email = "dev@acme.test"
jql = "assignee = currentUser() AND statusCategory != Done ORDER BY duedate"

[sources.slack]
kind = "slack"
# Conversations to watch. Omit to use the direct messages Slack lists.
channels = []

[sources.calendar]
kind = "google-calendar"
calendar_id = "primary"
lookahead_hours = 12


# --- Dev workflows gateway --------------------------------------------------
# Only vetinarid reads this. It signs in at the OIDC issuer by device code
# (`vetinarid login`) and keeps the credential in the keyring.

[autognomus]
gateway_url = "https://autognomus.example.net"
issuer = "https://id.example.net/realms/home"
client_id = "vetinari"
audience = "autognomus"
# worker = "hex"                 # default: the hostname
# On a machine with no keyring, or against an issuer with no device code
# endpoint (the local dev stack), read the token from a file instead; it
# replaces issuer and client_id, and is read again whenever the gateway
# refuses it, so rotating the file needs no restart.
# token_file = "~/.config/vetinari/autognomus-token"


# --- OAuth clients ----------------------------------------------------------
# Only needed for providers that use the device-code flow (the calendars).
# These identify the application rather than you; the tokens they obtain are
# what goes in the keychain.

[oauth.google-calendar]
client_id = "000000000000-xxxxxxxxxxxxxxxxxxxxxxxxxxxx.apps.googleusercontent.com"
client_secret = "GOCSPX-xxxxxxxxxxxxxxxxxxxx"


# --- Keybindings ------------------------------------------------------------
# Bindings layer over the Doom Emacs defaults. Set defaults = false to start
# from nothing instead. A binding that would shadow another is reported at
# start-up rather than silently dropped.

[keymap]
defaults = true
# Remove a default binding, e.g. to free its prefix for a longer sequence.
unbind = { normal = [] }

[keymap.normal]
"SPC o o" = "agent-logs"
"SPC o s" = "meeting-schedule"

[keymap.insert]
"C-c" = "cancel-pending"
